version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: fincore-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: auth_db
    volumes:
      - mongodb_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fincore-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: fincore-api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      ACCOUNT_SERVICE_URL: http://account-service:8083
      TRANSACTION_SERVICE_URL: http://transaction-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    depends_on:
      - auth-service
      - user-service
      - account-service
      - transaction-service
      - notification-service

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: fincore-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/auth_db
    depends_on:
      - mongodb

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: fincore-user-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/user_db
    depends_on:
      - mongodb

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: fincore-account-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/account_db
    depends_on:
      - mongodb

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: fincore-transaction-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/transaction_db
      SPRING_RABBITMQ_HOST: rabbitmq
      ACCOUNT_SERVICE_URL: http://account-service:8083
    depends_on:
      - mongodb
      - rabbitmq
      - account-service

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: fincore-notification-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/notification_db
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - mongodb
      - rabbitmq

volumes:
  mongodb_data: